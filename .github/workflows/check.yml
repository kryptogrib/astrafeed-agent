name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
        with:
          python-version: "3.12"
      - run: uv sync --group dev --locked
      - run: make check
      - run: uv run --with pip-audit pip-audit -l
      - run: docker build --build-arg GIT_COMMIT=ci -t astrafeed:ci .
