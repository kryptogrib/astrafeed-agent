[project]
name = "astrafeed"
version = "0.1.0"
description = "Live Telegram agenda with source-backed claims for humans and agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "instructor>=1.15.1",
    "numpy>=2.1,<3",
    "openai>=2.41.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2",
    "telethon>=1.43.2",
    "uvicorn[standard]>=0.49.0",
    "xpoz>=0.8.0",
]

[project.scripts]
astrafeed-serve = "astrafeed.cli:serve"
astrafeed-brief = "astrafeed.cli:brief"
astrafeed-pulse = "astrafeed.cli:pulse"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astrafeed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "import-linter>=2.11",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# refs: vendored reference project, not ours to lint.
# docs: dated probe scripts kept as evidence of a past audit — they are records
# of what was run, not code we maintain, and `make check` never linted them.
extend-exclude = ["refs", "docs"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade,
# B bugbear, C4 comprehensions, SIM simplify
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
# UP042: migrating domain (str, Enum) -> StrEnum changes str()/serialization
# semantics; out of scope for tooling setup, revisit deliberately.
ignore = ["UP042"]

[tool.ruff.lint.isort]
known-first-party = ["astrafeed", "tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["astrafeed"]
ignore_missing_imports = true   # telethon/openai ship partial or no stubs
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
