services:
  app:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    env_file: .env
    environment:
      ASTRAFEED_DATABASE_URL: sqlite+aiosqlite:////data/astrafeed.db
      ASTRAFEED_API_HOST: 0.0.0.0
    ports:
      - "${ASTRAFEED_HTTP_PORT:-8000}:8000"
    volumes:
      - astrafeed-data:/data
      - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  astrafeed-data:
